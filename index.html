<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./main.js"></script>
  </head>
  <body>
    <main>
      <div class="dashboard">
        <div class="report report--profile">
          <div class="profile__header">
            <div class="profile__avatar--wrapper">
              <img
                class="profile__avatar"
                src="./images/image-jeremy.png"
                alt=""
              />
            </div>
            <p class="profile__desc">Report for</p>
            <h1 class="profile__name">Jeremy Robson</h1>
          </div>
          <div class="report-content report-filter">
            <button
              class="report-filter__option report-filter__option--active"
              data-period="daily"
            >
              Daily
            </button>
            <button class="report-filter__option" data-period="weekly">
              Weekly
            </button>
            <button class="report-filter__option" data-period="monthly">
              Monthly
            </button>
          </div>
        </div>

        <div class="report report--work">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="work">Work</div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>

        <div class="report report--play">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="play">Play</div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>

        <div class="report report--study">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="study">Study</div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>

        <div class="report report--exercise">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="exercise">
                Exercise
              </div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>

        <div class="report report--social">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="social">Social</div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>

        <div class="report report--self-care">
          <div class="report__content">
            <div class="report__header">
              <div class="report__category" data-category="self-care">
                Self Care
              </div>
              <img
                class="report__button"
                src="./images/icon-ellipsis.svg"
                alt=""
              />
            </div>
            <h2 class="report__current">Loading...</h2>
            <p class="report__previous">Loading...</p>
          </div>
        </div>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Yasin</a>.
    </footer>
  </body>
</html>
